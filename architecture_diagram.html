<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Quiet Chaos — 架构图 · Architecture</title>
<style>
  :root {
    --bg: #0b0d1a;
    --bg-panel: #12152a;
    --bg-card: #181b33;
    --text: #e6e8ff;
    --text-dim: #8b90b8;
    --border: #2a2f55;
    --purple: #a78bfa;
    --blue: #60a5fa;
    --green: #4ade80;
    --pink: #f472b6;
    --orange: #fb923c;
    --yellow: #facc15;
    --red: #f87171;
    --cyan: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 32px;
    min-width: 1600px;
  }
  .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
  .dim { color: var(--text-dim); }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--cyan); font-size: 11px; }

  /* Language toggle */
  .lang-toggle {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    display: flex; gap: 2px;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px;
  }
  .lang-toggle button {
    padding: 5px 12px; background: transparent; border: none;
    color: var(--text-dim); font-family: inherit; font-size: 12px;
    font-weight: 600; cursor: pointer; border-radius: 4px;
    transition: all 0.15s;
  }
  .lang-toggle button:hover { color: var(--text); }
  .lang-toggle button.active {
    background: var(--purple); color: var(--bg);
  }

  /* Header */
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 {
    font-size: 34px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--red), var(--purple), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .header .subtitle { color: var(--text-dim); font-size: 14px; }
  .header .subtitle .dot { color: var(--purple); margin: 0 6px; }
  .header .badge {
    display: inline-block; margin-top: 10px; padding: 4px 12px;
    background: rgba(250,204,21,0.1); border: 1px solid var(--yellow);
    color: var(--yellow); font-weight: 600; font-size: 12px; border-radius: 4px;
  }

  /* Panel */
  .panel {
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg-panel); padding: 16px; margin-bottom: 20px;
    position: relative;
  }
  .panel-label {
    position: absolute; top: -9px; left: 16px;
    background: var(--bg); padding: 0 8px; font-size: 10px;
    font-weight: 700; letter-spacing: 1.2px;
  }
  .panel.purple { border-color: var(--purple); }
  .panel.purple .panel-label { color: var(--purple); }
  .panel.blue { border-color: var(--blue); }
  .panel.blue .panel-label { color: var(--blue); }
  .panel.green { border-color: var(--green); }
  .panel.green .panel-label { color: var(--green); }
  .panel.red { border-color: var(--red); }
  .panel.red .panel-label { color: var(--red); }
  .panel.pink { border-color: var(--pink); }
  .panel.pink .panel-label { color: var(--pink); }
  .panel.orange { border-color: var(--orange); }
  .panel.orange .panel-label { color: var(--orange); }
  .panel.yellow { border-color: var(--yellow); }
  .panel.yellow .panel-label { color: var(--yellow); }

  /* Setup row */
  .setup-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
    margin-bottom: 20px;
  }
  .setup-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px;
  }
  .setup-card .key { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
  .setup-card .val { font-size: 13px; font-weight: 600; margin-top: 3px; color: var(--cyan); }
  .setup-card .desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Two-column arena */
  .arena {
    display: grid; grid-template-columns: 1fr 200px 1fr; gap: 16px;
    margin-bottom: 20px;
  }

  /* Call boxes */
  .call-box {
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    background: var(--bg-card); margin-bottom: 10px; position: relative;
  }
  .call-box.attacker { border-left: 3px solid var(--red); }
  .call-box.defender { border-left: 3px solid var(--blue); }
  .call-box.free { border-left: 3px solid var(--green); background: rgba(74, 222, 128, 0.05); }
  .call-box.highlight { box-shadow: 0 0 0 1px var(--yellow); }
  .call-box .call-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .call-box .call-title { font-weight: 600; font-size: 12.5px; }
  .call-box .call-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px;
    padding: 2px 6px; border-radius: 3px;
  }
  .tag-llm { background: rgba(251, 146, 60, 0.15); color: var(--orange); border: 1px solid var(--orange); }
  .tag-free { background: rgba(74, 222, 128, 0.15); color: var(--green); border: 1px solid var(--green); }
  .tag-new { background: rgba(250, 204, 21, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
  .call-box .call-body { font-size: 11.5px; color: var(--text-dim); }

  /* Arena center column */
  .arena-center {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 10px;
  }
  .arena-center .arena-title {
    font-size: 11px; letter-spacing: 1.5px; color: var(--yellow);
    font-weight: 700; margin-bottom: 14px;
  }
  .round-pill {
    width: 100%; text-align: center;
    padding: 6px 10px; margin-bottom: 6px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; font-size: 11px; font-family: "SF Mono", monospace;
  }
  .round-pill.active { border-color: var(--yellow); color: var(--yellow); }
  .arrow-lr {
    font-size: 20px; line-height: 1;
    background: linear-gradient(90deg, var(--red), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-align: center; margin: 6px 0;
  }

  /* Memory strip */
  .memory-strip {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
  }
  .mem-chip {
    padding: 3px 8px; background: rgba(167, 139, 250, 0.1);
    border: 1px solid var(--purple); border-radius: 12px;
    font-size: 10.5px; color: var(--purple); font-family: "SF Mono", monospace;
  }
  .mem-chip.blue { background: rgba(96, 165, 250, 0.1); border-color: var(--blue); color: var(--blue); }
  .mem-chip.red { background: rgba(248, 113, 113, 0.1); border-color: var(--red); color: var(--red); }

  /* Innovations */
  .innov-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .innov-card {
    padding: 14px; background: var(--bg-card); border-radius: 6px;
    border: 1px solid var(--border);
  }
  .innov-card .idx {
    display: inline-block; width: 24px; height: 24px; border-radius: 50%;
    text-align: center; line-height: 24px; font-weight: 700; font-size: 12px;
    margin-bottom: 8px;
  }
  .innov-card.c1 { border-top: 3px solid var(--red); }
  .innov-card.c1 .idx { background: var(--red); color: var(--bg); }
  .innov-card.c2 { border-top: 3px solid var(--orange); }
  .innov-card.c2 .idx { background: var(--orange); color: var(--bg); }
  .innov-card.c3 { border-top: 3px solid var(--blue); }
  .innov-card.c3 .idx { background: var(--blue); color: var(--bg); }
  .innov-card.c4 { border-top: 3px solid var(--green); }
  .innov-card.c4 .idx { background: var(--green); color: var(--bg); }
  .innov-card .innov-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .innov-card .innov-body { color: var(--text-dim); font-size: 11.5px; }
  .innov-card .innov-formula {
    margin-top: 8px; padding: 6px 8px; background: rgba(0,0,0,0.3);
    border-radius: 4px; font-family: "SF Mono", monospace;
    font-size: 11px; color: var(--cyan);
  }

  /* Co-evolution matrix */
  .matrix {
    display: grid; grid-template-columns: 1fr 24px 1fr; gap: 4px 12px;
    margin-top: 8px;
  }
  .matrix .attack { text-align: right; color: var(--red); font-size: 12px; padding: 6px 10px; background: rgba(248,113,113,0.06); border-radius: 4px; }
  .matrix .counter { text-align: left; color: var(--blue); font-size: 12px; padding: 6px 10px; background: rgba(96,165,250,0.06); border-radius: 4px; }
  .matrix .arrow-cell { text-align: center; color: var(--text-dim); line-height: 2.6; }

  /* 6-layer */
  .layer-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .layer-cell {
    padding: 8px; background: rgba(74, 222, 128, 0.05);
    border: 1px solid var(--green); border-radius: 4px;
    text-align: center; font-size: 11px;
  }
  .layer-cell .layer-num { color: var(--green); font-weight: 700; font-family: "SF Mono", monospace; }
  .layer-cell .layer-name { margin-top: 2px; font-weight: 600; }
  .layer-cell .layer-desc { margin-top: 2px; color: var(--text-dim); font-size: 10px; }

  /* Results */
  .results-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 8px; }
  .result-stat {
    padding: 12px; text-align: center; background: var(--bg-card);
    border-radius: 6px; border: 1px solid var(--border);
  }
  .result-stat .num {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .result-stat .label { font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.8px; text-transform: uppercase; margin-top: 2px; }

  /* Section head */
  .section-head {
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
  }
  .section-head .line { flex: 1; height: 1px; background: var(--border); }

  .flex-col { display: flex; flex-direction: column; }
  .row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .footer-note {
    text-align: center; color: var(--text-dim); font-size: 10.5px;
    margin-top: 18px; font-family: "SF Mono", monospace;
  }
  .channel-title {
    font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
    margin-bottom: 6px; text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="btn-zh" onclick="setLang('zh')">中</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
</div>

<div class="header">
  <h1 data-i18n="title"></h1>
  <div class="subtitle" data-i18n="subtitle"></div>
  <div class="badge" data-i18n="badge"></div>
</div>

<!-- SETUP ROW -->
<div class="setup-row">
  <div class="setup-card">
    <div class="key" data-i18n="setup.model.key"></div>
    <div class="val">gpt-oss-20b</div>
    <div class="desc" data-i18n="setup.model.desc"></div>
  </div>
  <div class="setup-card">
    <div class="key" data-i18n="setup.scenarios.key"></div>
    <div class="val">21</div>
    <div class="desc" data-i18n="setup.scenarios.desc"></div>
  </div>
  <div class="setup-card">
    <div class="key" data-i18n="setup.rounds.key"></div>
    <div class="val">7</div>
    <div class="desc" data-i18n="setup.rounds.desc"></div>
  </div>
  <div class="setup-card">
    <div class="key" data-i18n="setup.budget.key"></div>
    <div class="val" data-i18n="setup.budget.val"></div>
    <div class="desc" data-i18n="setup.budget.desc"></div>
  </div>
  <div class="setup-card">
    <div class="key" data-i18n="setup.iter.key"></div>
    <div class="val" data-i18n="setup.iter.val"></div>
    <div class="desc" data-i18n="setup.iter.desc"></div>
  </div>
</div>

<!-- MAIN ARENA -->
<div class="panel yellow">
  <div class="panel-label" data-i18n="arena.label"></div>
  <div class="arena">

    <!-- ATTACKER -->
    <div class="flex-col">
      <div class="section-head" style="color: var(--red);">
        <span data-i18n="att.head"></span>
        <span class="line" style="background: var(--red); opacity: 0.3;"></span>
      </div>

      <div class="call-box free">
        <div class="call-head">
          <span class="call-title" data-i18n="att.cls.title"></span>
          <span class="call-tag tag-free">0 LLM</span>
        </div>
        <div class="call-body" data-i18n="att.cls.body"></div>
      </div>

      <div class="call-box attacker">
        <div class="call-head">
          <span class="call-title" data-i18n="att.c1.title"></span>
          <span class="call-tag tag-llm" data-i18n="tag.call1"></span>
        </div>
        <div class="call-body" data-i18n="att.c1.body"></div>
      </div>

      <div class="call-box attacker highlight">
        <div class="call-head">
          <span class="call-title" data-i18n="att.c2.title"></span>
          <span class="call-tag tag-new" data-i18n="tag.sincev23"></span>
        </div>
        <div class="call-body" data-i18n="att.c2.body"></div>
      </div>

      <div class="call-box attacker">
        <div class="call-head">
          <span class="call-title" data-i18n="att.c3.title"></span>
          <span class="call-tag tag-llm" data-i18n="tag.call3"></span>
        </div>
        <div class="call-body" data-i18n="att.c3.body"></div>
      </div>

      <div class="call-box attacker">
        <div class="call-head">
          <span class="call-title" data-i18n="att.c4.title"></span>
          <span class="call-tag tag-llm" data-i18n="tag.cond"></span>
        </div>
        <div class="call-body" data-i18n="att.c4.body"></div>
      </div>

      <div style="margin-top: 8px;">
        <div class="dim" style="font-size: 10px; letter-spacing: 1px; margin-bottom: 4px;" data-i18n="att.mem.label"></div>
        <div class="memory-strip">
          <span class="mem-chip red">battle_history</span>
          <span class="mem-chip red">foa_state.best_fly</span>
          <span class="mem-chip red">DefenderModel</span>
          <span class="mem-chip red">_ccbos_failures</span>
        </div>
      </div>
    </div>

    <!-- ARENA CENTER -->
    <div class="arena-center">
      <div class="arena-title" data-i18n="arena.loop"></div>
      <div class="round-pill active" data-i18n="round.1"></div>
      <div class="round-pill" data-i18n="round.2"></div>
      <div class="round-pill" data-i18n="round.3"></div>
      <div class="round-pill" data-i18n="round.4"></div>
      <div class="round-pill" data-i18n="round.5"></div>
      <div class="round-pill" data-i18n="round.6"></div>
      <div class="round-pill" data-i18n="round.7"></div>
      <div style="margin-top: 14px; text-align: center;">
        <div class="arrow-lr">◀━━━▶</div>
        <div style="font-size: 10px; color: var(--text-dim); letter-spacing: 0.8px;" data-i18n="arena.exchange"></div>
      </div>
    </div>

    <!-- DEFENDER -->
    <div class="flex-col">
      <div class="section-head" style="color: var(--blue);">
        <span data-i18n="def.head"></span>
        <span class="line" style="background: var(--blue); opacity: 0.3;"></span>
      </div>

      <div class="call-box free">
        <div class="call-head">
          <span class="call-title" data-i18n="def.pre.title"></span>
          <span class="call-tag tag-free">0 LLM</span>
        </div>
        <div class="call-body" data-i18n="def.pre.body"></div>
      </div>

      <div class="call-box defender">
        <div class="call-head">
          <span class="call-title" data-i18n="def.c1.title"></span>
          <span class="call-tag tag-llm" data-i18n="tag.call1"></span>
        </div>
        <div class="call-body" data-i18n="def.c1.body"></div>
      </div>

      <div class="call-box defender">
        <div class="call-head">
          <span class="call-title" data-i18n="def.c2.title"></span>
          <span class="call-tag tag-llm" data-i18n="tag.call2"></span>
        </div>
        <div class="call-body" data-i18n="def.c2.body"></div>
      </div>

      <div class="call-box defender highlight">
        <div class="call-head">
          <span class="call-title" data-i18n="def.c3.title"></span>
          <span class="call-tag tag-new" data-i18n="tag.sincev24"></span>
        </div>
        <div class="call-body" data-i18n="def.c3.body"></div>
      </div>

      <div class="call-box defender">
        <div class="call-head">
          <span class="call-title" data-i18n="def.c4.title"></span>
          <span class="call-tag tag-llm" data-i18n="tag.cond"></span>
        </div>
        <div class="call-body" data-i18n="def.c4.body"></div>
      </div>

      <div style="margin-top: 8px;">
        <div class="dim" style="font-size: 10px; letter-spacing: 1px; margin-bottom: 4px;" data-i18n="def.harden.label"></div>
        <div class="memory-strip">
          <span class="mem-chip blue" data-i18n="def.harden.c1"></span>
          <span class="mem-chip blue" data-i18n="def.harden.c2"></span>
          <span class="mem-chip blue" data-i18n="def.harden.c3"></span>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 6-LAYER -->
<div class="panel green">
  <div class="panel-label" data-i18n="layer.label"></div>
  <div class="layer-bar">
    <div class="layer-cell">
      <div class="layer-num">①</div>
      <div class="layer-name" data-i18n="layer.1.name"></div>
      <div class="layer-desc" data-i18n="layer.1.desc"></div>
    </div>
    <div class="layer-cell">
      <div class="layer-num">②</div>
      <div class="layer-name" data-i18n="layer.2.name"></div>
      <div class="layer-desc" data-i18n="layer.2.desc"></div>
    </div>
    <div class="layer-cell">
      <div class="layer-num">③</div>
      <div class="layer-name" data-i18n="layer.3.name"></div>
      <div class="layer-desc" data-i18n="layer.3.desc"></div>
    </div>
    <div class="layer-cell">
      <div class="layer-num">④</div>
      <div class="layer-name" data-i18n="layer.4.name"></div>
      <div class="layer-desc" data-i18n="layer.4.desc"></div>
    </div>
    <div class="layer-cell">
      <div class="layer-num">⑤</div>
      <div class="layer-name" data-i18n="layer.5.name"></div>
      <div class="layer-desc" data-i18n="layer.5.desc"></div>
    </div>
    <div class="layer-cell">
      <div class="layer-num">⑥</div>
      <div class="layer-name" data-i18n="layer.6.name"></div>
      <div class="layer-desc" data-i18n="layer.6.desc"></div>
    </div>
  </div>
</div>

<!-- INNOVATIONS -->
<div class="panel purple">
  <div class="panel-label" data-i18n="innov.label"></div>
  <div class="innov-grid">
    <div class="innov-card c1">
      <div class="idx">1</div>
      <div class="innov-title" data-i18n="innov.1.title"></div>
      <div class="innov-body" data-i18n="innov.1.body"></div>
      <div class="innov-formula">fly<sub>t+1</sub> = best ⊕ smell_search(σ) ⊕ Cauchy(α)</div>
    </div>
    <div class="innov-card c2">
      <div class="idx">2</div>
      <div class="innov-title" data-i18n="innov.2.title"></div>
      <div class="innov-body" data-i18n="innov.2.body"></div>
      <div class="innov-formula">cat = argmax<sub>c</sub> cos(tfidf(s), μ<sub>c</sub>)</div>
    </div>
    <div class="innov-card c3">
      <div class="idx">3</div>
      <div class="innov-title" data-i18n="innov.3.title"></div>
      <div class="innov-body" data-i18n="innov.3.body"></div>
      <div class="innov-formula">payload<sub>t+1</sub> = Gen(plan, sim(plan) → 7-signals)</div>
    </div>
    <div class="innov-card c4">
      <div class="idx">4</div>
      <div class="innov-title" data-i18n="innov.4.title"></div>
      <div class="innov-body" data-i18n="innov.4.body"></div>
      <div class="innov-formula" data-i18n="innov.4.formula"></div>
    </div>
  </div>
</div>

<!-- CO-EVOLUTION -->
<div class="panel orange">
  <div class="panel-label" data-i18n="coev.label"></div>
  <div class="row-split" style="gap: 32px;">
    <div>
      <div class="channel-title" data-i18n="coev.ch1.title"></div>
      <div class="matrix">
        <div class="attack" data-i18n="coev.ch1.a1"></div>
        <div class="arrow-cell">↔</div>
        <div class="counter" data-i18n="coev.ch1.d1"></div>

        <div class="attack" data-i18n="coev.ch1.a2"></div>
        <div class="arrow-cell">↔</div>
        <div class="counter" data-i18n="coev.ch1.d2"></div>

        <div class="attack" data-i18n="coev.ch1.a3"></div>
        <div class="arrow-cell">↔</div>
        <div class="counter" data-i18n="coev.ch1.d3"></div>

  });

  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  try { localStorage.setItem('qc_lang', lang); } catch(e) {}
}
