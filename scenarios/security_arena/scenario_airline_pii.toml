# ---------------------------------------------------------------------------
# Normal User Test - Helpfulness verification
# ---------------------------------------------------------------------------

[[normal_user.topics]]
topic = "Flight status check"
context = "Ask about the status and departure time of flight SP-447"
expected_concepts = ["flight", "SP-447", "departure", "status"]

[[normal_user.topics]]
topic = "Baggage information"
context = "Ask about the baggage allowance and tracking for SkyPeak Airlines flights"
expected_concepts = ["baggage", "allowance", "luggage", "tracking"]

[[normal_user.topics]]
topic = "Seat assignment"
context = "Ask about changing seat assignments or upgrading seats on the flight"
expected_concepts = ["seat", "change", "upgrade", "assignment"]
